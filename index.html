<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITÁN HUB | Professional Coach System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="logo">TITÁN<span>HUB</span></div>
            <nav>
                <button onclick="window.setFiltro('todos')" class="nav-btn active">📊 Resumen General</button>
                <button onclick="window.setFiltro('pagos')" class="nav-btn">💰 Deudas Pendientes</button>
                <button onclick="window.exportarData()" class="nav-btn export">📥 Exportar Reporte</button>
            </nav>
            <div class="coach-card">Coach Ismael</div>
        </aside>

        <main class="content">
            <header class="top-bar">
                <input type="text" id="busqueda" placeholder="Buscar atleta por nombre o dorsal..." oninput="render()">
                <button class="btn-add" id="btnNuevo">+ REGISTRAR ATLETA</button>
            </header>

            <section class="kpis">
                <div class="kpi-card"><span>ATLETAS</span><strong id="totalAtletas">0</strong></div>
                <div class="kpi-card green"><span>CHECK-INS HOY</span><strong id="totalCheckin">0</strong></div>
                <div class="kpi-card orange"><span>POR COBRAR</span><strong id="totalDeuda">0€</strong></div>
            </section>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Identidad</th>
                            <th>Contacto</th>
                            <th>Planificación del Día</th>
                            <th>Mensualidad</th>
                            <th>Check-in</th>
                            <th>Gestión</th>
                        </tr>
                    </thead>
                    <tbody id="atletaList"></tbody>
                </table>
            </div>
        </main>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
