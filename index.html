<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHL Logistics - Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginOverlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#D40511; z-index:9999; display:flex; justify-content:center; align-items:center; flex-direction:column;">
    <div style="background:white; padding:40px; border-radius:8px; text-align:center; box-shadow:0 10px 25px rgba(0,0,0,0.3); width:320px;">
        <h1 style="color:#D40511; margin-bottom:10px; font-family:sans-serif;">DHL</h1>
        <p style="font-weight:bold; color:#333; margin-bottom:20px;">SISTEMA GERENCIAL</p>
        <input type="password" id="passInput" placeholder="Contraseña de Acceso" style="width:100%; padding:12px; margin-bottom:20px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box; text-align:center;">
        <button id="btnLogin" style="width:100%; background:#D40511; color:white; border:none; padding:15px; border-radius:4px; font-weight:bold; cursor:pointer;">ENTRAR AL SISTEMA</button>
        <p id="errorPass" style="color:red; font-size:0.8rem; margin-top:15px; display:none; font-weight:bold;">⚠️ CLAVE INCORRECTA</p>
    </div>
</div>

<div class="header-dhl">
    <div class="logo">DHL <span>Time Intelligence Control</span></div>
</div>

<div class="container">
    <div class="dashboard">
        <aside class="card-form">
            <h3>📦 Registro Administrativo</h3>
            <div class="form-group"><label>Nombre del Colaborador:</label><input type="text" id="nombre" placeholder="Nombre completo"></div>
            <div class="form-group"><label>Fecha:</label><input type="date" id="fecha"></div>
            <div class="form-group">
                <label>Tipo de Concepto:</label>
                <select id="tipoHora">
                    <option value="Extra">➕ Hora Extra (x1.0)</option>
                    <option value="Festiva">➕ Festiva (x1.75)</option>
                    <option value="Flexibilidad">➕ Flexibilidad (x1.0)</option>
                    <option value="Vacaciones">🌴 Vacaciones (Días/Horas)</option>
                    <option value="Libranza">➖ Libranza (Descuento)</option>
                </select>
            </div>
            <div class="form-group"><label>Cantidad (Horas/Días):</label><input type="number" id="cantidad" step="0.1"></div>
            <div class="form-group"><label>Comentarios / Observaciones:</label><input type="text" id="comentario" placeholder="Ej: Apoyo inventario"></div>
            
            <div id="mensajeAlerta"></div>
            <button id="btnGuardar" class="btn-main">GRABAR EN NUBE</button>
            <button id="btnExportar" class="btn-export">📊 EXCEL (SEGÚN BÚSQUEDA)</button>
        </aside>

        <main class="data-display">
            <div class="stats-container">
                <div class="stat-card"><small>TOTAL ACUMULADO</small><span id="totalGanadas">0.0</span></div>
                <div class="stat-card"><small>TOTAL LIBRADO</small><span id="totalLibradas">0.0</span></div>
                <div class="stat-card highlight"><small>SALDO DISPONIBLE</small><span id="totalSaldo">0.0</span></div>
            </div>

            <div style="background: var(--dhl-yellow); padding: 10px; border-radius: 4px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
                <span style="font-weight: bold; font-size: 0.8rem;">FILTRAR VISTA:</span>
                <input type="text" id="buscadorNombre" placeholder="Escribe el nombre para buscar o exportar..." style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>EMPLEADO</th>
                            <th>CONCEPTO</th>
                            <th>FECHA</th>
                            <th>ENTRA</th>
                            <th>SALE</th>
                            <th>SALDO</th>
                            <th>OBSERVACIONES</th>
                            <th>ACCION</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
